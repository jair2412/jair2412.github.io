# nginx sirve la página y reenvía /api/ al backend.
# Escucha en 8080 porque la imagen corre sin root (nginx-unprivileged), y sin root no se puede usar el puerto 80.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La API vive en otro contenedor. El navegador nunca la ve directamente.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 5s;
        # Por defecto nginx espera 60 s para CONECTARSE. Justo después de un rollout, el Service todavía
        # puede mandar la conexión a un pod de api que se acaba de apagar, y esa petición se quedaba un
        # minuto colgada (el smoke de STAGING tardaba 63 s). Dentro del clúster conectar toma milisegundos:
        # con 2 s la petición falla rápido y el siguiente intento cae en un pod vivo.
        proxy_connect_timeout 2s;
    }

    # Las métricas de la API son para Prometheus, no para Internet.
    location /metrics {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

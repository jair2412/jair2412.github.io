# Pipeline CI/CD del LAB-04 (IF-1116), sobre la app de demo-cicd. STAGING vive en mi Codespace (runner self-hosted + kind).
#
# Un job por etapa, encadenados con needs. Si uno falla, los siguientes no corren.
# Las acciones van fijadas por SHA (el tag queda como comentario): un tag se puede mover, un SHA no.
#
# B6: las cuatro revisiones baratas corren en paralelo, y package espera a las cuatro.
# Ninguna compuerta se salta: nada se publica sin lint, SAST, unitarias e integración en verde.
#
#   lint ─────────────┐
#   sast ─────────────┤
#   test-unit ────────┼─> package ─> security ─> deploy-dev ─> deploy-staging
#   test-integration ─┘
#
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# B6: si subo otro commit al mismo PR, el run anterior ya no sirve y se cancela.
# En main no se cancela nada: cada merge tiene que llegar a su despliegue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: 1. Lint (ESLint, HTMLHint, Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci && npm ci --prefix api
      - run: npm run lint
      - name: Hadolint sobre los tres Dockerfiles
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
          config: .hadolint.yaml
          failure-threshold: warning

  sast:
    name: 2. SAST y secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Semgrep, análisis estático del código
        run: >
          docker run --rm -v "$PWD:/src:ro" semgrep/semgrep:1.180.0
          semgrep scan --config p/ci --config p/dockerfile --error --metrics=off /src
      # B2: TruffleHog en lugar de Gitleaks. Revisa todo el historial igual que Gitleaks, pero además
      # intenta verificar cada hallazgo contra el servicio real (¿el token sigue vivo?), y eso ayuda a priorizar.
      # --results incluye los no verificados: un secreto que hoy no responde igual no debe estar en Git.
      # --fail: si encuentra algo, sale con código 183 y el job se pone en rojo.
      - name: TruffleHog, secretos en el historial de Git
        run: >
          docker run --rm -v "$PWD:/repo:ro" trufflesecurity/trufflehog:3.99.7
          git file:///repo --results=verified,unknown,unverified --fail --no-update

  test-unit:
    name: 3. Pruebas unitarias y del sitio
    runs-on: ubuntu-latest           # B6: ya no espera a lint, corre en paralelo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci && npm ci --prefix api
      - run: npm run test:unit -- --reporter=default --reporter=json --outputFile.json=unitarias.json
      - run: npm run test:site -- --reporter=default --reporter=json --outputFile.json=sitio.json
      - name: Resumen de las pruebas
        if: always()
        run: node scripts/resumen.mjs pruebas "Pruebas unitarias y del sitio" unitarias.json sitio.json

  test-integration:
    name: 4. Pruebas de integración (Compose)
    runs-on: ubuntu-latest           # B6: ya no espera a test-unit, corre en paralelo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Levantar la aplicación
        run: |
          echo "DB_PASSWORD=$(openssl rand -hex 12)" > .env
          docker compose up -d --build --wait
      - run: npm run test:integration -- --reporter=default --reporter=json --outputFile.json=integracion.json
      - name: Resumen de las pruebas
        if: always()
        run: node scripts/resumen.mjs pruebas "Pruebas de integración (Compose)" integracion.json
      - name: Logs de los contenedores (solo si algo falló)
        if: failure()
        run: docker compose logs
      - name: Apagar
        if: always()
        run: docker compose down -v

  package:
    name: 5. Empaquetar y publicar (${{ matrix.servicio }})
    needs: [lint, sast, test-unit, test-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servicio: [web, api, db]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nombre de la imagen (GHCR exige minúsculas)
        run: echo "IMAGEN=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/demo-cicd-${{ matrix.servicio }}" >> "$GITHUB_ENV"
      # B6: sin QEMU ni arm64. DEV (runner de GitHub) y STAGING (mi Codespace) son amd64;
      # emular arm64 era lo más lento del build y nadie usaba esa imagen.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGEN }}
          tags: type=sha,format=long,prefix=sha-
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.servicio }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

  security:
    name: 6. Escaneo de imagen (${{ matrix.servicio }})
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false        # que se vean los hallazgos de las tres imágenes, no solo de la primera que falla
      matrix:
        servicio: [web, api, db]
    env:
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Nombre de la imagen
        run: echo "IMAGEN=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/demo-cicd-${{ matrix.servicio }}" >> "$GITHUB_ENV"
      # La compuerta: CRITICAL o HIGH con parche detienen el pipeline.
      - name: Trivy (compuerta CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGEN }}:sha-${{ github.sha }}
          severity: CRITICAL,HIGH        # la regla del curso (B1 del LAB-04)
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore
      # B5: el conteo por severidad para el resumen del run. No es la compuerta (esa es el paso anterior):
      # reutiliza el Trivy y la base de datos que ya instaló la acción, y corre aunque la compuerta falle.
      - name: Resumen de vulnerabilidades por severidad
        if: always()
        run: |
          trivy image --quiet --format json --output trivy.json --ignorefile .trivyignore "$IMAGEN:sha-${{ github.sha }}"
          node scripts/resumen.mjs trivy "${{ matrix.servicio }}" trivy.json

  deploy-dev:
    name: 7. Deploy DEV (efímero, k3d) y smoke
    needs: security
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: echo "PREFIJO=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/demo-cicd" >> "$GITHUB_ENV"
      # B2: k3d en lugar de kind. k3s (el Kubernetes liviano de Rancher) dentro de Docker:
      # un clúster de verdad igual que kind, pero arranca más rápido. El binario va con versión fija.
      - name: Crear el clúster (k3d)
        run: |
          sudo curl -fsSLo /usr/local/bin/k3d https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          sudo chmod +x /usr/local/bin/k3d
          k3d cluster create dev --wait --timeout 120s --no-lb
          kubectl get nodes
      - name: Namespace y secretos
        run: |
          kubectl create namespace demo-dev
          kubectl -n demo-dev create secret docker-registry ghcr \
            --docker-server=ghcr.io --docker-username="${{ github.actor }}" --docker-password="${{ secrets.GITHUB_TOKEN }}"
          kubectl -n demo-dev create secret generic db-credenciales --from-literal=DB_PASSWORD="$(openssl rand -hex 16)"
      - name: Desplegar
        run: scripts/desplegar.sh k8s/overlays/dev "$PREFIJO" "sha-${{ github.sha }}"
      - name: Esperar el rollout
        run: |
          kubectl -n demo-dev rollout status deploy/db  --timeout=180s
          kubectl -n demo-dev rollout status deploy/api --timeout=180s
          kubectl -n demo-dev rollout status deploy/web --timeout=180s
      - name: Smoke test y pruebas de integración contra DEV
        run: |
          kubectl -n demo-dev port-forward svc/web 8080:80 &
          sleep 3
          bash scripts/smoke.sh http://localhost:8080
          APP_URL=http://localhost:8080 npm run test:integration -- --reporter=default --reporter=json --outputFile.json=integracion-dev.json
      - name: Resumen de DEV
        if: always()
        run: |
          node scripts/resumen.mjs pruebas "Smoke e integración contra DEV (k3d)" integracion-dev.json
          {
            echo "### 📦 Imágenes que pasaron por DEV"
            echo
            echo "Estas son las que se promueven a STAGING, sin reconstruir:"
            echo
            for s in web api db; do echo "- \`$PREFIJO-$s:sha-${{ github.sha }}\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnóstico (solo si algo falló)
        if: failure()
        run: |
          kubectl -n demo-dev get all
          kubectl -n demo-dev describe pods
          kubectl -n demo-dev logs -l app=api --tail=50 || true
          kubectl -n demo-dev logs -l app=db  --tail=50 || true

  deploy-staging:
    name: 8. Deploy STAGING (con aprobación)
    needs: deploy-dev
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    environment:
      name: staging
      url: http://localhost:30080
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "PREFIJO=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/demo-cicd" >> "$GITHUB_ENV"
      - name: Desplegar la misma imagen que pasó por DEV
        run: scripts/desplegar.sh k8s/overlays/staging "$PREFIJO" "sha-${{ github.sha }}"
      - name: Esperar el rollout
        run: |
          kubectl -n demo-staging rollout status deploy/db  --timeout=180s
          kubectl -n demo-staging rollout status deploy/api --timeout=180s
          kubectl -n demo-staging rollout status deploy/web --timeout=180s
      - name: Smoke test
        run: bash scripts/smoke.sh http://localhost:30080
      - name: Resumen de STAGING
        if: always()
        run: |
          {
            echo "### 🚀 STAGING (${{ job.status }})"
            echo
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- URL: http://localhost:30080 (en el Codespace del runner)"
            echo
            echo '```'
            kubectl -n demo-staging get pods -o custom-columns=POD:.metadata.name,ESTADO:.status.phase,IMAGEN:.spec.containers[0].image
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
